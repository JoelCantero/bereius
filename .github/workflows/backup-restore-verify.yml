name: Verify Backup And Restore

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/db-backup.sh"
      - "scripts/db-restore.sh"
      - "docker-compose.prod.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "prisma.config.ts"
      - "prisma/schema.prisma"
      - "prisma/migrations/**"
      - ".github/workflows/backup-restore-verify.yml"
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: backup-restore-verification-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Restore Into Fresh Database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECT_NAME: backupverify
      APP_DOMAIN: backupverify.example.test
      COMPOSE_FILE: docker-compose.prod.yml
      POSTGRES_USER: backupverify
      POSTGRES_DB: backupverify
      POSTGRES_PASSWORD: backup-verify-password
      AUTH_SECRET: backup-verify-secret-not-used-runtime-000

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start source database
        run: |
          docker network inspect traefik_network >/dev/null 2>&1 || docker network create traefik_network
          docker compose -f "$COMPOSE_FILE" up -d --wait db
          db_container="$(docker compose -f "$COMPOSE_FILE" ps -q db)"
          db_ip="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$db_container")"
          echo "DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${db_ip}:5432/${POSTGRES_DB}?schema=public" >> "$GITHUB_ENV"

      - name: Migrate and add verification record
        run: |
          pnpm exec prisma migrate deploy
          docker compose -f "$COMPOSE_FILE" exec -T db psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            --set ON_ERROR_STOP=1 -c \
            "INSERT INTO \"VerificationToken\" (identifier, token, expires) VALUES ('backup-check', 'restore-me', NOW() + interval '1 hour');"

      - name: Create backup
        run: pnpm db:backup "$RUNNER_TEMP/backups"

      - name: Recreate an empty database
        run: |
          docker compose -f "$COMPOSE_FILE" down --volumes
          docker compose -f "$COMPOSE_FILE" up -d --wait db

      - name: Refuse restore into a database with residual objects
        run: |
          backup_file="$(find "$RUNNER_TEMP/backups" -name '*.sql.gz' -print -quit)"
          docker compose -f "$COMPOSE_FILE" exec -T db psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            --set ON_ERROR_STOP=1 -c \
            "CREATE COLLATION public.residual_collation (provider = icu, locale = 'en-US');"
          if pnpm db:restore "$backup_file"; then
            echo "Restore unexpectedly accepted a non-empty database." >&2
            exit 1
          fi
          docker compose -f "$COMPOSE_FILE" exec -T db psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            --set ON_ERROR_STOP=1 -c "DROP COLLATION public.residual_collation;"

      - name: Restore and verify record
        run: |
          backup_file="$(find "$RUNNER_TEMP/backups" -name '*.sql.gz' -print -quit)"
          pnpm db:restore "$backup_file"
          restored="$(docker compose -f "$COMPOSE_FILE" exec -T db psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc \
            "SELECT token FROM \"VerificationToken\" WHERE identifier = 'backup-check';")"
          test "$restored" = "restore-me"

      - name: Clean up
        if: always()
        run: |
          docker compose -f "$COMPOSE_FILE" down --volumes
          docker network rm traefik_network >/dev/null 2>&1 || true